name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read
  packages: read

concurrency:
  group: build-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout scim-server-db
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/scim-server-db
          path: scim-server-db
          persist-credentials: false

      - name: Link sibling scim-server-db module
        shell: bash
        run: |
          set -euo pipefail

          ln -s "$GITHUB_WORKSPACE/scim-server-db" ../scim-server-db

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Run govulncheck
        shell: bash
        run: |
          set -euo pipefail

          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build and test with race detector and coverage
        shell: bash
        run: |
          set -euo pipefail

          go test -race -count=1 -coverprofile=coverage.out ./...

      # Scheduled weekly runs intentionally skip SonarQube Cloud because no code changed;
      # the Monday schedule exists specifically to re-run govulncheck and race tests
      # against newly published Go vulnerability DB advisories.
      - name: Check SonarQube Cloud availability
        id: sonar-gate
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          SONAR_TOKEN_PRESENT: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          set -euo pipefail

          echo "enabled=${SONAR_TOKEN_PRESENT}" >> "${GITHUB_OUTPUT}"

      - name: SonarQube Cloud Scan
        if: ${{ steps.sonar-gate.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

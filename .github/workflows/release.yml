name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Choose the semantic version bump for this release."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

jobs:
  release:
    name: Validate, tag, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Verify main branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "This release workflow can only be run manually from main."
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            scim-server-db

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout scim-server-db
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/scim-server-db
          path: scim-server-db
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Link sibling scim-server-db module
        shell: bash
        run: |
          set -euo pipefail

          ln -s "$GITHUB_WORKSPACE/scim-server-db" ../scim-server-db

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "scimsandbox-release-bot[bot]"
          git config user.email "5655615+scimsandbox-release-bot[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          current_version="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION must contain a semantic version in the form x.y.z: ${current_version}" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          case "$VERSION_BUMP" in
            patch)
              patch="$((patch + 1))"
              ;;
            minor)
              minor="$((minor + 1))"
              patch=0
              ;;
            major)
              major="$((major + 1))"
              minor=0
              patch=0
              ;;
            *)
              echo "Unsupported version bump: ${VERSION_BUMP}" >&2
              exit 1
              ;;
          esac

          release_version="${major}.${minor}.${patch}"
          tag_name="v${release_version}"

          printf '%s\n' "$release_version" > VERSION
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not exist
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag_name }} already exists"
            exit 1
          fi

      - name: Run govulncheck
        shell: bash
        run: |
          set -euo pipefail

          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build and test with race detector
        shell: bash
        run: |
          set -euo pipefail

          go test -race -count=1 ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for pre-release scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: scim-server-impl-go:pre-release-scan

      - name: Enforce pre-release Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scim-server-impl-go:pre-release-scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail

          git add VERSION
          git commit -m "chore(release): v${{ steps.version.outputs.release_version }} [skip ci]"

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          git archive \
            --format=tar.gz \
            --prefix="scim-server-impl-go-${{ steps.version.outputs.release_version }}/" \
            --output "dist/scim-server-impl-go-${{ steps.version.outputs.release_version }}.source.tar.gz" \
            HEAD

          for arch in amd64 arm64; do
            package_dir="dist/scim-server-impl-go-${{ steps.version.outputs.release_version }}-linux-${arch}"
            mkdir -p "$package_dir"

            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "$package_dir/scim-server-impl-go" ./cmd/server

            cp LICENSE README.md CONTRIBUTING.md SECURITY.md VERSION "$package_dir/"
            cp -R config "$package_dir/"

            tar -czf "dist/scim-server-impl-go-${{ steps.version.outputs.release_version }}-linux-${arch}.tar.gz" \
              -C dist "scim-server-impl-go-${{ steps.version.outputs.release_version }}-linux-${arch}"
          done

      - name: Push release commit and tag
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git push origin "HEAD:${TARGET_BRANCH}"
          git tag -a "${{ steps.version.outputs.tag_name }}" -m "Release ${{ steps.version.outputs.tag_name }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag_name }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${{ steps.version.outputs.tag_name }}" \
            --verify-tag \
            --generate-notes \
            --title "${{ steps.version.outputs.tag_name }}" \
            "dist/scim-server-impl-go-${{ steps.version.outputs.release_version }}.source.tar.gz#scim-server-impl-go-${{ steps.version.outputs.release_version }}.source.tar.gz" \
            "dist/scim-server-impl-go-${{ steps.version.outputs.release_version }}-linux-amd64.tar.gz#scim-server-impl-go-${{ steps.version.outputs.release_version }}-linux-amd64.tar.gz" \
            "dist/scim-server-impl-go-${{ steps.version.outputs.release_version }}-linux-arm64.tar.gz#scim-server-impl-go-${{ steps.version.outputs.release_version }}-linux-arm64.tar.gz"

  attest:
    name: Attest release artifacts
    needs:
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.tar.gz" \
            --dir dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

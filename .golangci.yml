version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
  settings:
    gosec:
      excludes:
        - G104
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test files and shared test helpers intentionally omit production response/error/gosec guards.
      - path: (_test\.go|^internal/testsupport/)
        linters:
          - bodyclose
          - errcheck
          - gosec
      # writeJSON streams the JSON body after w.WriteHeader(status) has already committed the HTTP response status.
      - path: ^internal/handler/base\.go$
        text: '\(\*encoding/json\.Encoder\)\.Encode'
        linters:
          - errcheck
      # WriteScimError streams the error body after w.WriteHeader(err.Status) has already committed the HTTP response status.
      - path: ^internal/scim/error\.go$
        text: '\(\*encoding/json\.Encoder\)\.Encode'
        linters:
          - errcheck
      # Config files are read solely from trusted startup paths (GO_CONFIG_DIR / CLI startup wiring), never from user input.
      - path: ^internal/configloader/configloader\.go$
        text: "G304:"
        linters:
          - gosec
      # Poll handler writes stored RFC 8935/8936 SET JSON payloads with an explicit Content-Type: application/json header.
      - path: ^internal/handler/async_event\.go$
        text: "G705:"
        linters:
          - gosec

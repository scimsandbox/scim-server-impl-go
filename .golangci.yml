version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
  settings:
    errcheck:
      exclude-functions:
        - (*encoding/json.Encoder).Encode
    gosec:
      excludes:
        - G104
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: (_test\.go|^internal/testsupport/)
        linters:
          - bodyclose
          - errcheck
          - gosec
      - path: ^internal/configloader/configloader\.go$
        text: "G304:"
        linters:
          - gosec
      - path: ^internal/handler/async_event\.go$
        text: "G705:"
        linters:
          - gosec

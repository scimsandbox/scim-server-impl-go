server:
  port: 8080
  read_timeout: 15s
  read_header_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 30s
management:
  port: 9090
rate_limit:
  enabled: true
  # Server-wide global cap across all clients and workspaces
  requests_per_second: 1000
  burst: 100
  # Pre-auth per-client-IP limit (protects DB auth lookups from unauthenticated floods)
  per_ip_requests_per_second: 250
  per_ip_burst: 50
  # Post-auth per-workspace limit (isolates authenticated tenants)
  per_workspace_requests_per_second: 250
  per_workspace_burst: 50
  wait_timeout: 0s
storage:
  dsn: "jdbc:postgresql://localhost:5432/scimplayground"
  username: "scim_playground"
  password: "scim_playground"
  max_conns: 50
  min_conns: 50
cleanup:
  enabled: true
  interval: 2h
  stale_after: 2160h
  request_logs:
    enabled: true
    interval: 1h
    max_count: 10000
logging:
  level: "info"
messages:
  language: "en"
